[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ucp-merchant-offer-normalizer"
version = "0.1.0"
description = "Normalizes heterogeneous merchant pricing, tax, shipping SLA, and return policies into canonical UCP offer graphs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
ucp-merchant-offer-normalizer = "ucp_merchant_offer_normalizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ucp_merchant_offer_normalizer*"]
